spring:
  application:
    name: amigo
  liquibase:
    enabled: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-6-luna}
          reasoning-effort: none
    mcp:
      client:
        type: SYNC
        stdio:
          connections:
            weather:
              command: npx
              args:
                - -y
                - "@dangahagan/weather-mcp@latest"
            newsmcp:
              command: uvx
              args:
                - --with
                - "mcp<2"
                - --from
                - git+https://github.com/berlinbra/news-api-mcp
                - news-api-mcp
              env:
                NEWS_API_KEY: ${NEWS_API_KEY}
            sports:
              command: uvx
              args:
                - sportsdata-mcp
                - serve
              env:
                SPORTSDATA_MCP_GROUPS: espn.scores
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

amigo:
  frontend-url: ${AMIGO_FRONTEND_URL:http://localhost:5173}
  agent:
    memory:
      max-messages: ${CHAT_MEMORY_MAX_MESSAGES:20}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
