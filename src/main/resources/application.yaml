spring:
  application:
    name: amigo
  liquibase:
    enabled: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-6-luna}
          reasoning-effort: none
    mcp:
      client:
        type: SYNC
        stdio:
          connections:
            weather:
              command: npx
              args:
                - -y
                - "@dangahagan/weather-mcp@latest"
            newsmcp:
              command: uvx
              args:
                - --with
                - "mcp<2"
                - --from
                - git+https://github.com/berlinbra/news-api-mcp
                - news-api-mcp
              env:
                NEWS_API_KEY: ${NEWS_API_KEY}
            sports:
              command: uvx
              args:
                - sportsdata-mcp
                - serve
              env:
                SPORTSDATA_MCP_GROUPS: espn.scores
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

amigo:
  frontend-url: ${AMIGO_FRONTEND_URL:http://localhost:5173}
  agent:
    system-prompt: ${AMIGO_SYSTEM_PROMPT:You are a helpful and friendly assistant. Answer clearly and accurately. Use the news tools for current news, weather tools for current weather and forecasts, and soccer tools for current soccer information. Do not guess current events, conditions, scores, or schedules.}
    memory:
      max-messages: ${CHAT_MEMORY_MAX_MESSAGES:20}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
